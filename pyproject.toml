[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "actionradius"
version = "0.1.0"
description = "GitHub Actions third-party dependency blast-radius mapper"
authors = [
    {name = "Security Student"}
]
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "typer>=0.9.0",
    "jinja2>=3.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]
async = [
    "httpx>=0.27.0"
]

[project.scripts]
actionradius = "actionradius.cli:app"

[tool.setuptools.packages.find]
where = ["."]
